<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beaver Mock Contest</title>
<style>
:root {
  --bg: #eef2f5; --surface: #ffffff; --ink: #14242e; --muted: #5a6d78; --line: #cdd8de;
  --accent: #b5561b; --accent-ink: #ffffff; --water: #1d6f86; --water-soft: #d9ebf0;
  --good: #1f7a4a; --good-soft: #dcf1e4; --bad: #b3261e; --bad-soft: #fbe2df; --warn: #9a6400; --warn-soft: #fbefd0;
  --paper: #ffffff; --paper-ink: #1c2326; --paper-line: #d9e1e3;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1a20; --surface: #15262e; --ink: #e4edf0; --muted: #94aab3; --line: #2a4049;
    --accent: #f08a4b; --accent-ink: #1a0d05; --water: #6cc3d9; --water-soft: #173b46;
    --good: #6fd39c; --good-soft: #143a27; --bad: #ff8a80; --bad-soft: #42201d; --warn: #f2c261; --warn-soft: #3d3010;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); padding: 0 16px 72px; }
.wrap { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding-top: 28px; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(30px, 6vw, 42px); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 22px; font-weight: 800; }
h3 { font-size: 19px; font-weight: 700; }
p { margin: 0; }
a { color: var(--water); }
.eyebrow { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--water); }
.muted { color: var(--muted); } .small { font-size: 14px; }
button, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, li[data-pick]:focus-visible, summary:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.big { padding: 14px 26px; font-size: 18px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spread { justify-content: space-between; }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.lede { color: var(--muted); max-width: 62ch; }

/* front page gallery */
header.top { display: flex; flex-direction: column; gap: 8px; }
.scorebar { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 4px; }
.scorebar span { background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 10px; font-size: 13px; color: var(--muted); }
.scorebar b { font: 700 14px var(--mono); color: var(--ink); margin-right: 4px; }
.seg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seglabel { font-size: 14px; color: var(--muted); margin-right: 4px; min-width: 118px; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; }
.seg label span { display: block; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 14px; background: var(--surface); }
.seg input:checked + span { background: var(--water); border-color: var(--water); color: var(--surface); font-weight: 700; }
.seg input:focus-visible + span { outline: 3px solid var(--water); outline-offset: 2px; }
.heroes { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; }
.shelf { display: flex; flex-direction: column; gap: 10px; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 10px 16px; font-weight: 700; font-size: 16px; color: var(--muted); white-space: nowrap; border-radius: 8px 8px 0 0; }
.tab:hover { color: var(--ink); background: var(--water-soft); }
.tab[aria-selected="true"] { color: var(--water); border-bottom-color: var(--water); }
.shelfhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.gallery { display: grid; gap: 10px; }
.gallery.years { grid-template-columns: repeat(5, 1fr); }
.gallery.topics { grid-template-columns: repeat(4, 1fr); }
.gallery.parts3 { grid-template-columns: repeat(3, 1fr); }
.card { position: relative; text-align: left; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: transform .15s, border-color .15s, box-shadow .15s; }
.card:hover:not(:disabled) { border-color: var(--water); transform: translateY(-2px); box-shadow: 0 6px 16px rgb(0 0 0 / .08); }
.card:disabled { opacity: .6; cursor: default; }
.ctitle { font-weight: 800; font-size: 26px; line-height: 1.1; letter-spacing: -0.01em; }
.ctitle.sm { font-size: 16px; line-height: 1.25; }
.chint { font-size: 13px; color: var(--muted); line-height: 1.4; flex: 1; }
.cmeta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cmeta b.ok { color: var(--good); } .cmeta b.mid { color: var(--warn); } .cmeta b.low { color: var(--bad); }
.meter { height: 6px; border-radius: 3px; background: var(--water-soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--water); }
.meter.ok i { background: var(--good); } .meter.mid i { background: var(--warn); } .meter.low i { background: var(--bad); }
.badge { position: absolute; top: -9px; right: 10px; background: var(--bad); color: var(--surface); font: 700 11px var(--mono); border-radius: 999px; padding: 2px 8px; }
.card.hero { padding: 20px; gap: 8px; background: var(--water-soft); border-color: var(--water); }
.card.hero .ctitle { font-size: 30px; }
.card.hero .chint { font-size: 14px; color: var(--ink); }
.card.hero.alt { background: var(--surface); border-color: var(--line); }
.card.hero.alt .chint { color: var(--muted); }
.go { align-self: flex-start; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 10px; padding: 8px 16px; }
.card.hero.alt .go { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
@media (max-width: 640px) { .heroes { grid-template-columns: 1fr; } .gallery.years { grid-template-columns: repeat(3, 1fr); } .gallery.topics { grid-template-columns: repeat(2, 1fr); } .gallery.parts3 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }

/* score chart */
:root { --s-you: #1d6f86; --s-avg: #8a6d3b; --s-top: #7a3fa0; --top-soft: #efe4f7; }
@media (prefers-color-scheme: dark) { :root { --s-you: #6cc3d9; --s-avg: #d0a968; --s-top: #c79be8; --top-soft: #33234a; } }
.chart .ltop { fill: none; stroke: var(--s-top); stroke-width: 2; stroke-dasharray: 2 4; stroke-linecap: round; }
.chart .mtop { fill: var(--s-top); stroke: var(--surface); stroke-width: 2; }
.legend i.ktop { border-top: 3px dotted var(--s-top); }
.vs.top { color: var(--s-top); }
.avgline.top { background: var(--top-soft); } .avgline.top > b { color: var(--s-top); }
.ladder { position: relative; height: 10px; border-radius: 5px; background: var(--surface); margin: 14px 6px 4px; }
.ladder i { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; }
.ladder i.lyoum { width: 14px; height: 14px; top: -2px; margin-left: -7px; border-radius: 50%; border: 2px solid var(--surface); }
i.lyoum { background: var(--s-you); } i.lavgm { background: var(--s-avg); } i.ltopm { background: var(--s-top); }
.ladderkey { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); }
.ladderkey i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 11px var(--mono); }
.chart .lyou { fill: none; stroke: var(--s-you); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .lavg { fill: none; stroke: var(--s-avg); stroke-width: 2; stroke-dasharray: 6 5; }
.chart .myou { fill: var(--s-you); stroke: var(--surface); stroke-width: 2; }
.chart .mavg { fill: var(--s-avg); stroke: var(--surface); stroke-width: 2; }
.chart .dlabel { fill: var(--ink); font: 700 13px var(--body); }
.chart .dlabel.sub { fill: var(--muted); font-weight: 400; }
.chart .hit { fill: transparent; cursor: crosshair; outline: none; }
.chart .cross { stroke: var(--muted); stroke-width: 1; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { display: inline-block; width: 26px; height: 0; border-top: 3px solid var(--s-you); }
.legend i.kavg { border-top: 3px dashed var(--s-avg); }
.vs { font-weight: 700; white-space: nowrap; } .vs.up { color: var(--good); } .vs.down { color: var(--bad); }
.avgline { border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; background: var(--water-soft); }
.avgline.up { background: var(--good-soft); } .avgline.up > b { color: var(--good); }
.avgline.down { background: var(--bad-soft); } .avgline.down > b { color: var(--bad); }
.avgline span { font-size: 14px; }

/* mistakes */
.mgroup { gap: 8px; }
.mrow { border: 1.5px solid var(--line); border-radius: 10px; }
.mrow > summary { list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 10px 14px; color: var(--ink); font-weight: 400; }
.mrow > summary::-webkit-details-marker { display: none; }
.mrow > summary .mtitle { font-weight: 700; }
.mrow > summary .mtitle::before { content: "▸ "; color: var(--muted); }
.mrow[open] > summary .mtitle::before { content: "▾ "; }
.mrow > summary .pill { grid-column: 2; grid-row: 1 / span 2; }
.mrow[open] { border-color: var(--water); }
.mbody { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.tabs { scrollbar-width: thin; }

/* plan */
ol.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
ol.plan > li { display: flex; gap: 14px; padding: 12px; border-radius: 12px; border: 1.5px solid transparent; }
ol.plan > li.now { border-color: var(--water); background: var(--water-soft); }
ol.plan .num { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--mono); border: 2px solid var(--line); color: var(--muted); background: var(--surface); }
ol.plan li.now .num { border-color: var(--water); color: var(--water); }
ol.plan li.done .num { background: var(--good); border-color: var(--good); color: var(--surface); }
ol.plan li.done .pbody > b { color: var(--muted); }
.pbody { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
ol.simple { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }

/* start screen */
.rules { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.rule { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.rule b { display: block; font: 700 22px var(--mono); font-variant-numeric: tabular-nums; }
.rule span { font-size: 13px; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--water); background: var(--water-soft); }
.opt input { margin-top: 5px; accent-color: var(--water); }
.opt small { display: block; color: var(--muted); }
select { border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface); color: var(--ink); }
table.hist { border-collapse: collapse; width: 100%; font-size: 14px; }
table.hist td, table.hist th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.hist th { color: var(--muted); font-weight: 600; }

/* contest bar */
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.clocks { display: flex; gap: 10px; align-items: stretch; }
.clock { flex: 1; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 12px; display: flex; flex-direction: column; min-width: 0; }
.clock span { font-size: 12px; color: var(--muted); }
.clock b { font: 700 24px var(--mono); font-variant-numeric: tabular-nums; line-height: 1.2; }
.clock .track { height: 4px; border-radius: 2px; background: var(--water-soft); overflow: hidden; margin-top: 4px; }
.clock .track i { display: block; height: 100%; width: 100%; background: var(--water); transition: width 1s linear; }
.clock.low { border-color: var(--warn); } .clock.low b { color: var(--warn); } .clock.low .track i { background: var(--warn); }
.clock.out { border-color: var(--bad); background: var(--bad-soft); } .clock.out b { color: var(--bad); } .clock.out .track i { background: var(--bad); }
.pausebtn { flex: none; background: var(--surface); white-space: nowrap; }
.pausebox { align-items: flex-start; padding: 40px 28px; margin-top: 40px; }
.strip { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; }
.dot { height: 30px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); font: 11px var(--mono); color: var(--muted); padding: 0; min-width: 0; }
.dot.answered { background: var(--water-soft); color: var(--ink); border-color: var(--water-soft); }
.dot.locked { background: repeating-linear-gradient(45deg, var(--surface), var(--surface) 4px, var(--line) 4px, var(--line) 6px); }
.dot.dok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.dot.dno { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.feedback { border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--warn-soft); }
.feedback > b { color: var(--warn); font-size: 17px; }
.feedback.ok { background: var(--good-soft); } .feedback.ok > b { color: var(--good); }
.feedback.no { background: var(--bad-soft); } .feedback.no > b { color: var(--bad); }
.feedback summary { color: var(--ink); }
.feedback .paper { margin-top: 8px; }
.dot.current { border-color: var(--accent); color: var(--ink); border-width: 2.5px; }
.strip.std .dot:nth-child(5), .strip.std .dot:nth-child(10) { margin-right: 6px; }
.striplabels { display: grid; grid-template-columns: repeat(3, 1fr); font: 11px var(--mono); color: var(--muted); text-align: center; }

/* contest paper: stays white so the contest pictures look right */
.paper { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--paper-line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; overflow-wrap: anywhere; }
.paper .label { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #1d6f86; }
.paper .pts { font: 12px var(--mono); color: #557079; }
.paper p, .paper li { margin: 0 0 8px; }
.paper img { max-width: 100%; height: auto; }
.paper table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; margin: 6px auto; width: fit-content; }
.paper td, .paper th { border: 1px solid var(--paper-line); padding: 4px 8px; }
.paper .center { text-align: center; }
.paper .row, .paper .columns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.paper .row.spread { justify-content: space-between; }
.paper button { display: none; }
.paper .column-two, .paper .column { flex: 1 1 220px; min-width: 0; }
.paper ol.mc, .paper ol[type="A"] { list-style: none; padding: 0; margin: 4px 0 0; counter-reset: mc; display: flex; flex-direction: column; gap: 6px; }
.paper ol.mc > li, .paper ol[type="A"] > li { counter-increment: mc; display: flex; gap: 10px; align-items: center; border: 1.5px solid var(--paper-line); border-radius: 10px; padding: 8px 12px; margin: 0; }
.paper ol.mc > li > p, .paper ol[type="A"] > li > p { margin: 0; }
.paper ol.mc > li::before, .paper ol[type="A"] > li::before { content: "(" counter(mc, upper-alpha) ")"; font: 13px var(--mono); color: #557079; flex: none; }
.paper li[data-pick] { cursor: pointer; }
.paper li.picked { border-color: #1d6f86 !important; background: #e3f1f5; box-shadow: inset 0 0 0 1px #1d6f86; }
.paper li.right { border-color: #1f7a4a !important; background: #e3f5ea; }
.paper li.wrong { border-color: #b3261e !important; background: #fde8e5; }
.paper mjx-container { color: var(--paper-ink); }
.lockednote { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 14px; font-weight: 600; }

.bubbles { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bubble { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: 16px var(--mono); }
.bubble.picked { background: var(--water); border-color: var(--water); color: var(--surface); }
.bubble:disabled { opacity: .5; cursor: default; }
.clear { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px; }

/* results */
.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score .n { font: 800 64px var(--mono); line-height: 1; color: var(--water); font-variant-numeric: tabular-nums; }
.score .of { font: 600 22px var(--mono); color: var(--muted); }
.parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.part { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.part b { font: 700 20px var(--mono); font-variant-numeric: tabular-nums; }
.tally { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 600; }
.pill.ok { background: var(--good-soft); color: var(--good); } .pill.no { background: var(--bad-soft); color: var(--bad); } .pill.blank { background: var(--warn-soft); color: var(--warn); } .pill.topic { background: var(--water-soft); color: var(--ink); font-weight: 400; }
table.sheet { border-collapse: collapse; width: 100%; font-size: 14px; }
table.sheet td, table.sheet th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; font-variant-numeric: tabular-nums; }
table.sheet th { color: var(--muted); font-weight: 600; }
table.sheet td.ok { color: var(--good); font-weight: 700; } table.sheet td.no { color: var(--bad); font-weight: 700; } table.sheet td.blank { color: var(--warn); font-weight: 700; }
table.sheet a { text-decoration: none; font-weight: 600; }
.tablewrap { overflow-x: auto; }
.item { display: flex; flex-direction: column; gap: 10px; min-width: 0; scroll-margin-top: 12px; }
.verdict { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.verdict .ok { color: var(--good); font-weight: 700; } .verdict .no { color: var(--bad); font-weight: 700; } .verdict .blank { color: var(--warn); font-weight: 700; }
.solution { border-left: 4px solid #1f7a4a; padding-left: 14px; display: flex; flex-direction: column; gap: 8px; }
.solution.missed { border-left-color: #b3261e; }
details > summary { cursor: pointer; color: #1d6f86; font-weight: 700; }
.review { display: flex; flex-direction: column; gap: 22px; }
.credit { font-size: 12px; color: var(--muted); }
.loading { color: var(--muted); padding: 60px 0; text-align: center; }
@media (max-width: 560px) { .rules { grid-template-columns: repeat(2, 1fr); } .paper { padding: 14px; } .clock b { font-size: 20px; } .dot { height: 26px; font-size: 10px; } }
</style>
<script>
window.MathJax = { tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] }, svg: { fontCache: "global" }, startup: { typeset: false } };
</script>

<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- contest rules ---------- */
const POINTS = { A: 8, B: 6, C: 4 };   // points for a correct answer in each part
const BLANK_POINTS = 2;                // points for a question left blank
const PER_QUESTION = 180;              // 3 minutes per question
const maxOf = items => items.reduce((s, q) => s + POINTS[q.part], 0);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const LETTERS = "ABCD";
const TOPICS = { pat: "Patterns & sequences", logic: "Logic & deduction", algo: "Following steps & tracking state", ds: "Stacks, queues & organizing data", graph: "Graphs, maps & networks", code: "Codes & binary", opt: "Optimization & game strategy" };

const ALL = window.BCC_INDEX || [];          // both grade levels
const lvOf = q => q.lv || "78";
let INDEX = [];                               // the questions for the grade level you're practising
const YEARS = [...new Set(ALL.map(q => q.y))].sort((a, b) => b - a);
const Q = {};
window.BCC_Q = d => { Q[keyOf(d)] = d; };

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- contest ---------- */

}

function paintPick() {

function paintClocks() {
  const z = state.quiz, tq = document.getElementById("tq"); if (!z || !tq) return;

  document.getElementById("bq").style.width = Math.max(0, left / PER_QUESTION * 100) + "%";
  cq.classList.toggle("low", left <= 30 && left > 0); cq.classList.toggle("out", left <= 0);

function tick() {
  const z = state.quiz; if (state.view !== "quiz" || !z) return;
  if (z.paused) { z.last = Date.now(); return; }
  const now = Date.now(), dt = Math.min(5, (now - z.last) / 1000);   // a sleeping laptop doesn't eat your time
  z.last = now; z.elapsed += dt;
  if (!z.locked[z.idx]) z.spent[z.idx] += dt;
  if (z.elapsed >= z.total) return finish(true);
  if (z.strict && !z.locked[z.idx] && z.spent[z.idx] >= PER_QUESTION) {
    z.locked[z.idx] = true;
    if (z.check) { renderQuiz(); return; }   // stay here and show whether you were right
    const order = z.items.map((_, k) => (z.idx + 1 + k) % z.items.length);
    const next = order.find(k => !z.locked[k]);
    if (next === undefined) return finish(true);
    z.idx = next; renderQuiz(); window.scrollTo(0, 0); return;
  }
  paintClocks();
}
setInterval(tick, 250);

function pointsFor(q, pick) { return pick === null ? BLANK_POINTS : pick === q.answer ? POINTS[q.part] : 0; }

function finish(timeUp) {
  const z = state.quiz;
  const rows = z.items.map((q, i) => ({ q, i, pick: z.picks[i], spent: Math.round(z.spent[i]), pts: pointsFor(q, z.picks[i]), kind: z.picks[i] === null ? "blank" : z.picks[i] === q.answer ? "ok" : "no" }));
  const r = {
    name: z.name, mode: z.mode, level: lvOf(z.items[0]), timeUp, rows, at: Date.now(), seconds: Math.min(z.total, Math.round(z.elapsed)),
    score: rows.reduce((s, x) => s + x.pts, 0), max: maxOf(z.items), avg: avgFor(z.items, z.mode), top: topFor(z.items, z.mode),
    right: rows.filter(x => x.kind === "ok").length, wrong: rows.filter(x => x.kind === "no").length, blank: rows.filter(x => x.kind === "blank").length
  };
  r.beat = standing(r.score, r.max, r.avg, z.items, z.mode);
  state.result = r; state.quiz = null;
  const hist = store.get("bccMockHistory", []);
  hist.push({ at: r.at, name: r.name, level: r.level, score: r.score, max: r.max, avg: r.avg, top: r.top, beat: r.beat, right: r.right, wrong: r.wrong, blank: r.blank, seconds: r.seconds });
  store.set("bccMockHistory", hist);
  const log = getLog(), seen = new Set(store.get("bccMockSeen", []));
  rows.forEach(x => { const k = keyOf(x.q); (log[k] = log[k] || []).push({ at: r.at, pick: x.pick, ok: x.kind === "ok", spent: x.spent }); seen.add(k); });
  store.set("bccMockLog", log); store.set("bccMockSeen", [...seen]);

}

    const data = {

      </div>
      <div class="row"><span class="small muted">A results file was saved to your Downloads folder so Claude can check your answers.</span><button class="clear" data-savefile="1">Save it again</button></div>
      <div class="tally"><span class="pill ok">${r.right} correct</span><span class="pill no">${r.wrong} wrong · 0 pts each</span><span class="pill blank">${r.blank} blank · ${BLANK_POINTS} pts each</span></div>
      <div class="parts">${["A", "B", "C"].filter(p => r.rows.some(x => x.q.part === p)).map(part).join("")}</div>
      ${r.wrong ? `<p class="small muted">Your ${r.wrong} wrong answer${r.wrong === 1 ? "" : "s"} would have been worth ${lostToGuess} points left blank.</p>` : ""}
      ${Object.keys(topics).length ? `<div><p class="small muted" style="margin-bottom:6px">Topics to practise (questions not answered correctly):</p><div class="tally">${Object.entries(topics).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<span class="pill topic">${TOPICS[t]} · ${n}</span>`).join("")}</div></div>
        <div><button class="btn" data-pmissed="1">Redo the ones I missed</button></div>` : `<p><b>100%. Every answer right.</b> Excellent work.</p>`}
    </section>
    <section class="panel">
      <h2>Answer sheet</h2>
      <div class="tablewrap"><table class="sheet"><tr><th>Q</th><th>Part</th><th>You</th><th>Answer</th><th>Result</th><th>Points</th><th>Time</th><th>From</th></tr>
      ${r.rows.map(x => `<tr><td><a href="#q${x.i}">${x.i + 1}</a></td><td>${x.q.part}</td><td>${x.pick === null ? "–" : LETTERS[x.pick]}</td><td>${LETTERS[x.q.answer]}</td><td class="${x.kind}">${word[x.kind]}</td><td>${x.pts}</td><td>${mmss(x.spent)}</td><td>${x.q.y} Q${x.q.n}</td></tr>`).join("")}
      </table></div>
    </section>
    <h2>Solutions</h2>
    <div class="review">${ordered.map(x => `
      <article class="item" id="q${x.i}" data-pickv="${x.pick ?? -1}" data-ans="${x.q.answer}">
        ${questionSheet(x.q, `Question ${x.i + 1} · Part ${x.q.part} · from the ${x.q.y} ${gradeName(lvOf(x.q))} contest`)}
        <div class="verdict"><span class="${x.kind}">${x.kind === "ok" ? "Correct" : x.kind === "blank" ? "Left blank" : `You picked (${LETTERS[x.pick]})`} · ${x.pts} point${x.pts === 1 ? "" : "s"}</span><span>Answer: <b>(${LETTERS[x.q.answer]})</b></span><span class="muted small">${TOPICS[x.q.topic]}</span></div>
        <div class="paper">
          <div class="solution ${x.kind === "ok" ? "" : "missed"}"><span class="label">Answer</span>${x.q.answerHtml}${x.q.explanation ? `<span class="label">Explanation</span>${x.q.explanation}` : ""}</div>
          ${x.q.connections ? `<details><summary>Connections to computer science</summary>${x.q.connections}</details>` : ""}
        </div>
      </article>`).join("")}</div>`;
  app.querySelectorAll(".item").forEach(el => {
    const pick = +el.dataset.pickv, ans = +el.dataset.ans;
    optionList(el).forEach((li, k) => { if (k === ans) li.classList.add("right"); else if (k === pick) li.classList.add("wrong"); });
  });
  typeset(app);
}

/* ---------- events ---------- */
app.addEventListener("change", e => {
  if (e.target.name === "mode") state.mode = e.target.value;
  else if (e.target.name === "mfilter") { state.mfilter = e.target.value; renderHome(); }
  else if (e.target.name === "level") { setLevel(e.target.value); renderHome(); }
  else if (e.target.name === "check") { state.check = e.target.value === "1"; store.set("bccMockCheck", state.check); }
  else if (e.target.name === "strict") state.strict = e.target.value === "1";
  else if (["year", "topic", "part"].includes(e.target.id)) {
    const id = e.target.id; state[id] = id === "year" ? +e.target.value : e.target.value; state.mode = id;
    const r = app.querySelector(`input[name="mode"][value="${id}"]`); if (r) r.checked = true;
  }
});
app.addEventListener("click", e => {
  const el = e.target.closest("[data-start],[data-go],[data-pick],[data-nav],[data-jump],[data-submit],[data-quit],[data-clearhist],[data-ptopic],[data-ppart],[data-pmissed],[data-pmixed],[data-pyear],[data-savefile],[data-tab],[data-check],[data-plan],[data-pause]");
  if (!el || el.disabled) return;
  const d = el.dataset, z = state.quiz;
  if (d.start) start();
  else if (d.plan) {
    const [a, v] = d.plan.split(":"), lv = a.endsWith("910") ? "910" : "78", m = a.replace(/78|910/, "");
    setLevel(lv); state.mode = m; if (m === "topic") state.topic = v; if (m === "part") state.part = v; if (m === "year") state.year = +v;
    const mine = state.check; state.check = !(m === "mixed" || m === "year");   // mocks and full papers: answers only at the end
    start().then(() => { state.check = mine; });
  }
  else if (d.tab) { state.tab = d.tab; store.set("bccMockTab", d.tab); renderHome(); app.querySelector(`[data-tab="${d.tab}"]`)?.focus(); }
  else if (d.ptopic) { state.mode = "topic"; state.topic = d.ptopic; start(); }
  else if (d.ppart) { state.mode = "part"; state.part = d.ppart; start(); }
  else if (d.pmixed) { state.mode = "mixed"; start(); }
  else if (d.pyear) { state.mode = "year"; state.year = +d.pyear; start(); }
  else if (d.pmissed) { state.mode = "missed"; start(); }
  else if (d.savefile) saveResultFile(state.result);
  else if (d.go) { state.view = d.go; renderHome(); window.scrollTo(0, 0); }
  else if (d.clearhist) { if (confirm("Clear your past scores and weak-point history?")) { store.set("bccMockHistory", []); store.set("bccMockLog", {}); renderHome(); } }
  else if (!z) return;
  else if (d.pick !== undefined) {
    if (z.locked[z.idx]) return;
    const p = +d.pick; z.picks[z.idx] = (p < 0 || z.picks[z.idx] === p) ? null : p; paintPick();
  }
  else if (d.pause) { z.paused = !z.paused; z.last = Date.now(); renderQuiz(); window.scrollTo(0, 0); }
  else if (d.check) { z.checked[z.idx] = true; z.locked[z.idx] = true; const top = window.scrollY; renderQuiz(); window.scrollTo(0, top); app.querySelector(".feedback")?.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  else if (d.nav) { z.idx += +d.nav; renderQuiz(); window.scrollTo(0, 0); }
  else if (d.jump !== undefined) { z.idx = +d.jump; renderQuiz(); window.scrollTo(0, 0); }
  else if (d.submit) {
    const blank = z.picks.filter((p, k) => p === null && !(z.check && z.locked[k])).length;
    if (confirm(blank ? `You've left ${blank} question${blank === 1 ? "" : "s"} blank (${BLANK_POINTS} points each). Submit the contest?` : "Submit the contest?")) finish(false);
    else z.last = Date.now();
  }
  else if (d.quit) { if (confirm("Quit this contest? It won't be scored.")) { state.quiz = null; state.view = "home"; renderHome(); window.scrollTo(0, 0); } else z.last = Date.now(); }
});
function showTip(e) {
  const el = e.target.closest && e.target.closest(".hit"), tip = document.getElementById("tip"), cross = document.getElementById("cross");
  if (!el || !tip) return;
  tip.textContent = el.dataset.tip;
  cross.setAttribute("x1", el.dataset.x); cross.setAttribute("x2", el.dataset.x); cross.setAttribute("visibility", "visible");
}
app.addEventListener("pointerover", showTip); app.addEventListener("focusin", showTip); app.addEventListener("click", showTip);
app.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("li[data-pick]")) { e.preventDefault(); e.target.click(); }
});
window.addEventListener("beforeunload", e => { if (state.quiz) { e.preventDefault(); e.returnValue = ""; } });

setLevel(state.level);
if (!INDEX.length) app.innerHTML = `<div class="panel"><h2>Questions not found</h2><p>Keep <b>index.html</b> in the same folder as the <b>q</b> folder, then open it again.</p></div>`;
else renderHome();
</script>
</body>
</html>
